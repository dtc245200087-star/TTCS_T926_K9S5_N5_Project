services:
  db:
    image: postgres:16
    container_name: dhtc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dieu_hanh_thi_cong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  backend:
    image: python:3.12-slim
    container_name: dhtc-backend
    working_dir: /app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dieu_hanh_thi_cong
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && python run.py"
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    container_name: dhtc-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
