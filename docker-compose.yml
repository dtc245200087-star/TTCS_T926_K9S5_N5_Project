services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME:-Quản trị viên}
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/instance
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
